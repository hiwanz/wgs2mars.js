version: 2.1

orbs:
  node: circleci/node@7.2.1

jobs:
  node-test:
    parameters:
      node-version:
        type: string

    docker:
      - image: cimg/node:<< parameters.node-version >>

    steps:
      - checkout

      - node/install-packages:
          pkg-manager: npm

      - run:
          name: Run Tests
          command: npm test

workflows:
  node-tests:
    jobs:
      - node-test:
          matrix:
            parameters:
              node-version: ["22", "24", "26"]
